[project]
name = "fabricator"
version = "0.1.0"
description = "Describe an object in plain words, review pictures, and get a print-ready file for a Bambu printer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13.0",
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "trimesh>=5.1.1",
]

[project.scripts]
fabricator = "fabricator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1.400"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real slicing"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "RUF", "PLE", "PLW",
]
# Not selected on purpose:
#   BLE, S110, S112 - the geometry kernel raises arbitrary exception types; catching them and
#                     falling back (or turning them into a plain message) is the design.
#   DTZ - dates written for the user are local calendar dates, not timestamps.
ignore = [
    "E501",    # the formatter handles line length; long strings stay readable
    "PERF401", # message-building loops read better than list.extend(generator)
    "RUF001",  # plain-language messages use typographic dashes and multiplication signs
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"examples/*/design.py" = ["F403", "F405"]  # designs use `from fabricator.design import *` on purpose
