# Build volume in mm (x, y, z) used when the slicer's own printer profile can't be read.
# When Bambu Studio is installed, the size is read from its printer profile instead.
printers:
  Bambu Lab A1 mini: {bed: [180, 180, 180], short: A1M}
  Bambu Lab A1:      {bed: [256, 256, 256], short: A1}
  Bambu Lab P1P:     {bed: [256, 256, 256], short: P1P}
  Bambu Lab P1S:     {bed: [256, 256, 256], short: P1S}
  Bambu Lab X1 Carbon: {bed: [256, 256, 256], short: X1C}
  Bambu Lab X1E:     {bed: [256, 256, 256], short: X1E}

# Bambu filament profile name to look for, per material.
materials:
  PLA: Bambu PLA Basic
  PETG: Bambu PETG HF
  ABS: Bambu ABS
  ASA: Bambu ASA
  TPU: Bambu TPU 95A

# Density in g/cm3, for estimates made without the slicer.
density: {PLA: 1.24, PETG: 1.27, ABS: 1.04, ASA: 1.07, TPU: 1.22}

# Thinnest wall worth printing, as a multiple of nozzle width (2 lines).
min_wall_lines: 2
# Smallest detail worth printing, as a multiple of nozzle width.
min_feature_lines: 1.5
